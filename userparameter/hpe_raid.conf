# hpe-raid-zabbix UserParameter definitions
# Install to: /etc/zabbix/zabbix_agent2.d/hpe_raid.conf
# Adjust SLOT (default 0) if your controller is in a different slot -
# check with: /usr/sbin/ssacli ctrl all show config

UserParameter=hpe.raid.status,sudo /usr/local/bin/hpe_raid_check.sh
UserParameter=hpe.raid.ld.raw,sudo /usr/sbin/ssacli ctrl slot=0 ld all show status 2>/dev/null
UserParameter=hpe.raid.pd.raw,sudo /usr/sbin/ssacli ctrl slot=0 pd all show status 2>/dev/null
UserParameter=hpe.raid.ctrl.temp,sudo /usr/sbin/ssacli ctrl slot=0 show detail 2>/dev/null | grep -A2 "Location: ASIC" | grep "Current Value" | awk '{print $4}'
